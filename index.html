<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>

  <!-- Google Fonts: Dancing Script, Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./css/style.css" />

  <!-- Thư viện Canvas Confetti (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <!-- Main Application Script -->
  <script src="./js/app.js" defer></script>
</head>
<body class="app" id="app-root">

  <!-- Background Canvas: Hiệu ứng bầu trời sao (Phase 1) -->
  <canvas class="starfield" id="starfield-canvas" aria-hidden="true"></canvas>

  <!-- ==========================================
       PHASE 1: THE INTERACTIVE HOOK
       ========================================== -->
  <main class="hook" id="phase-hook" aria-label="Nạp năng lượng yêu thương">
    <header class="hook__header">
      <span class="hook__badge">Special Gift • 20/10</span>
      <h1 class="hook__title">Trạm Nạp Năng Lượng Yêu Thương</h1>
      <p class="hook__subtitle">Nhấn hoặc giữ trái tim để mở khóa món quà đặc biệt</p>
    </header>

    <!-- Hộp quà 3D SVG -->
    <div class="hook__stage">
      <div class="hook__aura" id="gift-aura"></div>
      <div class="hook__gift-box" id="gift-box" role="img" aria-label="Hộp quà bí mật">
        <svg class="hook__gift-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="boxBodyGrad" x1="40" y1="100" x2="200" y2="210" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FF4D79" />
              <stop offset="100%" stop-color="#B81D47" />
            </linearGradient>
            <linearGradient id="boxLidGrad" x1="30" y1="70" x2="210" y2="110" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FF7597" />
              <stop offset="100%" stop-color="#D92658" />
            </linearGradient>
            <linearGradient id="ribbonGrad" x1="100" y1="35" x2="140" y2="210" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFE599" />
              <stop offset="50%" stop-color="#FFD166" />
              <stop offset="100%" stop-color="#E6A100" />
            </linearGradient>
            <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#FF3366" flood-opacity="0.45" />
            </filter>
          </defs>

          <g filter="url(#glowFilter)">
            <!-- Nơ hộp quà (Trái & Phải) -->
            <path d="M120 75C105 40 65 40 70 68C73 84 105 80 120 75Z" fill="url(#ribbonGrad)" />
            <path d="M120 75C135 40 175 40 170 68C167 84 135 80 120 75Z" fill="url(#ribbonGrad)" />
            <circle cx="120" cy="73" r="10" fill="#FFF3B0" />

            <!-- Thân hộp quà -->
            <rect x="48" y="102" width="144" height="102" rx="14" fill="url(#boxBodyGrad)" />
            <!-- Bóng đổ dưới nắp hộp -->
            <rect x="48" y="102" width="144" height="12" fill="#7A0B2B" fill-opacity="0.35" />

            <!-- Ruy băng dọc thân hộp -->
            <rect x="106" y="102" width="28" height="102" fill="url(#ribbonGrad)" />

            <!-- Nắp hộp quà -->
            <rect x="38" y="74" width="164" height="32" rx="10" fill="url(#boxLidGrad)" />
            <!-- Ruy băng nắp hộp -->
            <rect x="104" y="74" width="32" height="32" fill="url(#ribbonGrad)" />

            <!-- Chi tiết блик sáng (Highlight 3D) -->
            <path d="M52 84H88" stroke="white" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round" />
            <path d="M62 122V178" stroke="white" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
          </g>
        </svg>
      </div>
    </div>

    <!-- Thanh Tiến Trình (Progress Bar) -->
    <div class="hook__progress">
      <div class="hook__progress-header">
        <span class="hook__progress-label">Mức độ yêu thương</span>
        <span class="hook__progress-value" id="progress-text">0%</span>
      </div>
      <div
        class="hook__progress-track"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="progress-track"
      >
        <!-- Sử dụng transform: scaleX() để tránh reflow -->
        <div class="hook__progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Nút Tương Tác Trái Tim -->
    <div class="hook__controls">
      <button class="hook__heart-btn" id="heart-btn" type="button" aria-label="Bấm để nạp yêu thương">
        <span class="hook__heart-ripple"></span>
        <svg class="hook__heart-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          />
        </svg>
      </button>
      <span class="hook__hint">Click liên tục hoặc Nhấn giữ</span>
    </div>
  </main>

  <!-- ==========================================
       PHASE 2: THE REVEAL (GLASSMORPHISM CARD)
       ========================================== -->
  <section class="reveal" id="phase-reveal" aria-label="Thiệp chúc mừng 20/10" aria-hidden="true">
    <!-- Nút bật/tắt âm thanh góc trên phải -->
    <button class="reveal__audio-btn" id="audio-toggle-btn" type="button" aria-label="Bật/Tắt nhạc nền">
      <span class="reveal__audio-icon" id="audio-icon">🔊</span>
    </button>

    <article class="card">
      <!-- Phần 1: Text Section (Lời chúc & Typewriter) -->
      <div class="card__content">
        <div class="card__tag">Happy Vietnamese Women's Day</div>
        <h2 class="card__title">Gửi Nàng Nhân Văn Của Anh</h2>
        <div class="card__divider"></div>

        <div class="card__message-box">
          <p class="card__message">
            <span class="card__typewriter" id="typewriter-text"></span
            ><span class="card__cursor" id="typewriter-cursor">|</span>
          </p>
        </div>

        <footer class="card__footer">
          <p class="card__signature" id="card-signature">Thương gửi Nàng Nhân Văn Của Anh ngàn lời chúc tốt đẹp nhất ♥</p>
        </footer>
      </div>

      <!-- Phần 2: Gallery Section (Image Carousel) -->
      <div class="card__gallery">
        <div class="carousel" id="image-carousel" aria-roledescription="carousel" aria-label="Kỷ niệm đẹp">
          <div class="carousel__viewport">
            <!-- Các slide ảnh sẽ được render tự động từ mảng cấu hình trong app.js -->
            <div class="carousel__track" id="carousel-track"></div>
          </div>

          <!-- Nút điều hướng Prev / Next -->
          <button
            class="carousel__btn carousel__btn--prev"
            id="carousel-prev"
            type="button"
            aria-label="Ảnh trước"
          >
            &#10094;
          </button>
          <button
            class="carousel__btn carousel__btn--next"
            id="carousel-next"
            type="button"
            aria-label="Ảnh tiếp theo"
          >
            &#10095;
          </button>

          <!-- Dots Indicator -->
          <div class="carousel__dots" id="carousel-dots" role="tablist" aria-label="Chọn ảnh"></div>
        </div>
      </div>
    </article>
  </section>

  <!-- ==========================================
       AUDIO ELEMENT (ẨN)
       Cấu hình link nhạc trực tiếp tại đây hoặc trong js/app.js
       ========================================== -->
  <audio id="bg-music" preload="auto" loop></audio>

</body>
</html>
